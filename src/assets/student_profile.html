<body class="bg-background text-on-background min-h-screen flex flex-col font-body-md">
<!-- Navigation Shell Suppressed due to Linear/Transactional intent -->
<main class="flex-grow flex items-center justify-center p-container-padding-mobile md:p-container-padding-desktop">
<div class="w-full max-w-2xl">
<!-- Header Section -->
<div class="text-center mb-stack-lg">
<span class="material-symbols-outlined text-primary text-6xl mb-4" style="font-variation-settings: 'FILL' 1;">school</span>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-primary">Create Student Profile</h1>
<p class="font-body-md text-body-md text-on-surface-variant mt-stack-sm">Join Farmer Helper and connect with the agricultural community.</p>
</div>
<!-- Card Container -->
<div class="bg-surface-container-lowest rounded-[24px] shadow-[0_4px_20px_rgba(0,0,0,0.15)] border border-outline-variant/30 p-container-padding-mobile md:p-container-padding-desktop">
<form action="#" class="space-y-stack-md" method="POST">
<!-- Full Name -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-unit" for="fullName">Full Name</label>
<div class="relative rounded-md shadow-sm">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline">person</span>
</div>
<input class="block w-full pl-10 sm:text-sm border-outline/30 rounded-lg focus:ring-primary focus:border-primary h-[56px] bg-transparent text-on-surface" id="fullName" name="fullName" placeholder="John Doe" required="" type="text"/>
</div>
</div>
<!-- College / University -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-unit" for="university">College / University</label>
<div class="relative rounded-md shadow-sm">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline">account_balance</span>
</div>
<input class="block w-full pl-10 sm:text-sm border-outline/30 rounded-lg focus:ring-primary focus:border-primary h-[56px] bg-transparent text-on-surface" id="university" name="university" placeholder="Agricultural State University" required="" type="text"/>
</div>
</div>
<!-- Course & Year of Study Row -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-stack-md">
<!-- Course -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-unit" for="course">Course</label>
<div class="relative rounded-md shadow-sm">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline">book</span>
</div>
<input class="block w-full pl-10 sm:text-sm border-outline/30 rounded-lg focus:ring-primary focus:border-primary h-[56px] bg-transparent text-on-surface" id="course" name="course" placeholder="BSc Agriculture" required="" type="text"/>
</div>
</div>
<!-- Year of Study -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-unit" for="year">Year of Study</label>
<div class="relative rounded-md shadow-sm">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline">calendar_month</span>
</div>
<select class="block w-full pl-10 sm:text-sm border-outline/30 rounded-lg focus:ring-primary focus:border-primary h-[56px] bg-transparent text-on-surface" id="year" name="year" required="">
<option disabled="" selected="" value="">Select Year</option>
<option value="1">1st Year</option>
<option value="2">2nd Year</option>
<option value="3">3rd Year</option>
<option value="4">4th Year</option>
<option value="postgrad">Postgraduate</option>
</select>
</div>
</div>
</div>
<!-- Location -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-unit" for="location">Location</label>
<div class="relative rounded-md shadow-sm">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline">location_on</span>
</div>
<input class="block w-full pl-10 sm:text-sm border-outline/30 rounded-lg focus:ring-primary focus:border-primary h-[56px] bg-transparent text-on-surface" id="location" name="location" placeholder="City, State" required="" type="text"/>
</div>
</div>
<!-- Area of Interest -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-unit" for="interest">Area of Interest</label>
<div class="relative rounded-md shadow-sm">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline">eco</span>
</div>
<select class="block w-full pl-10 sm:text-sm border-outline/30 rounded-lg focus:ring-primary focus:border-primary h-[56px] bg-transparent text-on-surface" id="interest" name="interest" required="">
<option disabled="" selected="" value="">Select Primary Interest</option>
<option value="crop">Crop Science</option>
<option value="soil">Soil Management</option>
<option value="tech">AgriTech &amp; Data</option>
<option value="livestock">Livestock Management</option>
<option value="business">Agribusiness</option>
</select>
</div>
</div>
<!-- Submit Button -->
<div class="pt-stack-md mt-stack-md border-t border-outline-variant/30">
<button class="w-full flex justify-center items-center h-[56px] px-4 border border-transparent rounded-[16px] shadow-sm font-label-md text-label-md font-medium text-on-primary bg-primary hover:bg-primary-container focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition-colors duration-200" type="submit">
                            Create Student Profile
                            <span class="material-symbols-outlined ml-2">arrow_forward</span>
</button>
</div>
</form>
</div>
</div>
</main>
</body></html>
