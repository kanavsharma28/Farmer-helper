<body class="bg-background text-on-background font-body-md min-h-full flex flex-col antialiased">
<!-- TopNavBar (Suppressed as per rules for linear onboarding, replaced with minimal brand header) -->
<header class="w-full bg-surface-container-lowest py-4 px-container-padding-mobile md:px-container-padding-desktop flex justify-between items-center shadow-sm z-50">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary text-3xl">agriculture</span>
<span class="font-headline-md text-headline-md font-bold text-primary tracking-tight">Farmer Helper</span>
</div>
<div>
<span class="text-on-surface-variant font-label-md text-label-md">Onboarding Step 1 of 2</span>
</div>
</header>
<main class="flex-grow flex items-center justify-center py-12 px-container-padding-mobile">
<div class="w-full max-w-3xl bg-surface-container-lowest rounded-[24px] shadow-[0_4px_20px_rgba(0,0,0,0.05)] border border-outline-variant/30 overflow-hidden flex flex-col md:flex-row">
<!-- Left Branding Area (Image) -->
<div class="hidden md:block md:w-5/12 bg-surface-container relative">
<img alt="Agricultural background" class="absolute inset-0 w-full h-full object-cover" data-alt="A lush, expansive agricultural field bathed in warm, golden morning light. Rows of healthy green crops stretch towards the horizon, symbolizing growth and prosperity. The aesthetic is clean, natural, and highly professional, reflecting modern sustainable farming practices." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBt9CPAFeG8buIluEACl3RpXiDvWwwfc5Z515Rs-FDoOWjUnP3kr9SoDhpnM7XkeHR8CeGtS3KtsmA0cNXVl_6pFv8W2YqUz5UqaLS0sQenfRCrsw5TI_tIOA-TMRiyd1ipZ69KqAXA6Oiqnw7XwIt8GK4tZuROWorRhYzpGI9faa8LEwoOzSlu3rjDgc1lCfXkBVoXslr1qeFcPo-kDPlSrGfS0CeEnoidwZ5WkgIe1SZywXH4dQ1X"/>
<div class="absolute inset-0 bg-primary/20 mix-blend-multiply"></div>
</div>
<!-- Right Form Area -->
<div class="w-full md:w-7/12 p-8 md:p-12 flex flex-col justify-center">
<div class="mb-8">
<h1 class="font-headline-lg text-headline-lg text-on-background mb-2">Create Buyer Profile</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Tell us about your business to connect with quality farmers.</p>
</div>
<form class="space-y-6">
<!-- Business Name -->
<div>
<label class="block font-label-md text-label-md text-on-background mb-1" for="businessName">Business / Company Name</label>
<input class="w-full bg-surface border border-outline-variant rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary transition-colors text-on-background font-body-md placeholder-outline-variant/60" id="businessName" name="businessName" placeholder="e.g., AgriTrade Solutions" type="text"/>
</div>
<!-- Contact Person & Mobile (Side by side on desktop) -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-4">
<div>
<label class="block font-label-md text-label-md text-on-background mb-1" for="contactPerson">Contact Person</label>
<input class="w-full bg-surface border border-outline-variant rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary transition-colors text-on-background font-body-md placeholder-outline-variant/60" id="contactPerson" name="contactPerson" placeholder="Full Name" type="text"/>
</div>
<div>
<label class="block font-label-md text-label-md text-on-background mb-1" for="mobileNumber">Mobile Number</label>
<input class="w-full bg-surface border border-outline-variant rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary transition-colors text-on-background font-body-md placeholder-outline-variant/60" id="mobileNumber" name="mobileNumber" placeholder="+1 (555) 000-0000" type="tel"/>
</div>
</div>
<!-- Business Type & Location -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-4">
<div>
<label class="block font-label-md text-label-md text-on-background mb-1" for="businessType">Business Type</label>
<select class="w-full bg-surface border border-outline-variant rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary transition-colors text-on-background font-body-md appearance-none" id="businessType" name="businessType">
<option disabled="" selected="" value="">Select Type</option>
<option value="wholesaler">Wholesaler</option>
<option value="retailer">Retailer</option>
<option value="processor">Processor</option>
<option value="exporter">Exporter</option>
</select>
</div>
<div>
<label class="block font-label-md text-label-md text-on-background mb-1" for="location">Location</label>
<input class="w-full bg-surface border border-outline-variant rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary transition-colors text-on-background font-body-md placeholder-outline-variant/60" id="location" name="location" placeholder="City, Region" type="text"/>
</div>
</div>
<!-- Crops Purchased -->
<div>
<label class="block font-label-md text-label-md text-on-background mb-1" for="cropsPurchased">Crops Purchased (Select multiple)</label>
<div class="flex flex-wrap gap-2 mt-2">
<label class="cursor-pointer">
<input class="peer sr-only" name="crop" type="checkbox" value="wheat"/>
<div class="px-4 py-2 rounded-full border border-outline-variant bg-surface text-on-surface-variant font-label-md text-label-md peer-checked:bg-secondary/10 peer-checked:text-secondary peer-checked:border-secondary transition-all">Wheat</div>
</label>
<label class="cursor-pointer">
<input class="peer sr-only" name="crop" type="checkbox" value="corn"/>
<div class="px-4 py-2 rounded-full border border-outline-variant bg-surface text-on-surface-variant font-label-md text-label-md peer-checked:bg-secondary/10 peer-checked:text-secondary peer-checked:border-secondary transition-all">Corn</div>
</label>
<label class="cursor-pointer">
<input class="peer sr-only" name="crop" type="checkbox" value="soybeans"/>
<div class="px-4 py-2 rounded-full border border-outline-variant bg-surface text-on-surface-variant font-label-md text-label-md peer-checked:bg-secondary/10 peer-checked:text-secondary peer-checked:border-secondary transition-all">Soybeans</div>
</label>
<label class="cursor-pointer">
<input class="peer sr-only" name="crop" type="checkbox" value="rice"/>
<div class="px-4 py-2 rounded-full border border-outline-variant bg-surface text-on-surface-variant font-label-md text-label-md peer-checked:bg-secondary/10 peer-checked:text-secondary peer-checked:border-secondary transition-all">Rice</div>
</label>
<label class="cursor-pointer">
<input class="peer sr-only" name="crop" type="checkbox" value="other"/>
<div class="px-4 py-2 rounded-full border border-outline-variant bg-surface text-on-surface-variant font-label-md text-label-md peer-checked:bg-secondary/10 peer-checked:text-secondary peer-checked:border-secondary transition-all">Other...</div>
</label>
</div>
</div>
<!-- Primary Action -->
<div class="pt-6">
<button class="w-full h-14 bg-primary-container text-on-primary rounded-[16px] font-label-md text-label-md font-bold hover:bg-primary transition-colors flex items-center justify-center gap-2 shadow-sm" type="submit">
                            Create Buyer Profile
                            <span class="material-symbols-outlined text-lg">arrow_forward</span>
</button>
</div>
</form>

<span class="material-symbols-outlined text-primary dark:text-primary-fixed">agriculture</span>
<span class="font-headline-md text-headline-md text-primary dark:text-primary-fixed">Farmer Helper</span>
</div>
<div class="flex gap-4">
<a class="font-caption text-caption text-on-surface-variant dark:text-outline-variant hover:underline hover:text-secondary dark:hover:text-secondary-fixed" href="#">Privacy Policy</a>
<a class="font-caption text-caption text-on-surface-variant dark:text-outline-variant hover:underline hover:text-secondary dark:hover:text-secondary-fixed" href="#">Terms of Service</a>
<a class="font-caption text-caption text-on-surface-variant dark:text-outline-variant hover:underline hover:text-secondary dark:hover:text-secondary-fixed" href="#">Help Center</a>
<a class="font-caption text-caption text-on-surface-variant dark:text-outline-variant hover:underline hover:text-secondary dark:hover:text-secondary-fixed" href="#">Contact Us</a>
</div>
<div class="font-caption text-caption text-on-surface-variant dark:text-outline-variant">
                © 2024 Farmer Helper. All rights reserved.
            </div>
</div>
</footer>
</body></html>
